<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropHost — Clean File Hosting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #6366f1;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 32px;
    }

    .drop-zone {
      border: 2px dashed #e2e8f0;
      border-radius: 16px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fafafa;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: #6366f1;
      background: #f5f3ff;
    }

    .drop-zone-icon {
      width: 48px;
      height: 48px;
      background: #eef2ff;
      color: #6366f1;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .drop-zone-text {
      font-size: 14px;
      font-weight: 500;
      color: #334155;
    }

    .drop-zone-subtext {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    #file-input {
      display: none;
    }

    .file-details {
      margin-top: 24px;
      display: none;
      text-align: left;
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }

    .file-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #6366f1;
      transition: width 0.2s ease;
    }

    .result-box {
      margin-top: 24px;
      display: none;
    }

    .link-container {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .link-input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      outline: none;
      background: #ffffff;
      color: #334155;
    }

    .copy-btn {
      padding: 12px 18px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .copy-btn:hover {
      background: #4f46e5;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 16px;
      display: none;
      background: #fef2f2;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #fecaca;
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">Drop<span>Host</span></div>
    <p class="subtitle">Fast, clean & lightweight local file storage</p>

    <!-- Dropzone -->
    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-icon">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
      </div>
      <div class="drop-zone-text">Click to upload or drag & drop</div>
      <div class="drop-zone-subtext">Photos, PDFs & files up to 20MB</div>
      <input type="file" id="file-input">
    </div>

    <!-- Progress -->
    <div class="file-details" id="file-details">
      <div class="file-info">
        <span id="file-name">filename.png</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <!-- Error Message -->
    <div class="error-msg" id="error-msg">Something went wrong.</div>

    <!-- Result Link -->
    <div class="result-box" id="result-box">
      <div class="link-container">
        <input type="text" class="link-input" id="result-url" readonly>
        <button class="copy-btn" id="copy-btn">Copy Link</button>
      </div>
    </div>
  </div>

  <footer>Direct Local Upload Server</footer>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileDetails = document.getElementById('file-details');
    const fileName = document.getElementById('file-name');
    const progressPercent = document.getElementById('progress-percent');
    const progressBar = document.getElementById('progress-bar');
    const resultBox = document.getElementById('result-box');
    const resultUrl = document.getElementById('result-url');
    const copyBtn = document.getElementById('copy-btn');
    const errorMsg = document.getElementById('error-msg');

    const MAX_SIZE_MB = 20;

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) handleUpload(files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleUpload(fileInput.files[0]);
    });

    function handleUpload(file) {
      // Size Validation before network call
      if (file.size > MAX_SIZE_MB * 1024 * 1024) {
        showError(`File limit exceeded! Maximum allowed size is ${MAX_SIZE_MB}MB.`);
        return;
      }

      errorMsg.style.display = 'none';
      resultBox.style.display = 'none';
      fileDetails.style.display = 'block';
      fileName.textContent = file.name;
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';

      const formData = new FormData();
      formData.append('fileToUpload', file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'upload.php', true);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = percent + '%';
          progressPercent.textContent = percent + '%';
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            const res = JSON.parse(xhr.responseText);
            if (res.status === 'success') {
              resultUrl.value = res.url;
              resultBox.style.display = 'block';
            } else {
              showError(res.message);
            }
          } catch(e) {
            showError('Server side internal error occurred.');
          }
        } else {
          showError('Upload failed. Server returned error status.');
        }
      };

      xhr.onerror = function() {
        showError('Network error while connecting to server.');
      };

      xhr.send(formData);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      fileDetails.style.display = 'none';
    }

    copyBtn.addEventListener('click', () => {
      resultUrl.select();
      navigator.clipboard.writeText(resultUrl.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy Link', 2000);
    });
  </script>
</body>
</html>
